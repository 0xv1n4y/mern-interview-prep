# MongoDB

The most-asked MongoDB interview questions, explained simply: short answer, everyday example, code and a point-wise interview answer. **13 questions**, of which **9 are ★ must-ask**. Use the **🤖 Practice with AI** box inside each question to answer by typing or speaking and get feedback.

## Key terms in plain English

| Term | What it means (simply) |
|---|---|
| Database | A place that stores data permanently and lets you search it quickly. |
| NoSQL | Databases that don't use tables with fixed columns. MongoDB stores JSON-like documents. |
| Document | One record in MongoDB, like one JSON object (one user, one order). |
| Collection | A group of documents, like a table in SQL (all users). |
| BSON | Binary JSON: the format MongoDB uses to store documents. |
| _id / ObjectId | The unique id MongoDB automatically gives every document. |
| Schema | A blueprint saying which fields a document should have and their types. |
| Mongoose | A Node.js library that adds schemas, validation and easy queries on top of MongoDB. |
| Index | A sorted shortcut that helps find documents fast, like a book's index page. |
| Aggregation | Processing data step by step to get reports: filter, group, count, sum. |
| Replica set | Copies of the database on several servers, so data survives if one server fails. |
| Sharding | Splitting a huge collection across many servers. |

## MongoDB basics

### What is MongoDB? How is it different from SQL databases? {basic} {star}

:::quick
MongoDB is a **NoSQL, document database**. It stores data as JSON-like **documents** in **collections**, with a flexible structure. SQL databases (MySQL, PostgreSQL) store data in **tables with fixed columns** and use joins.
:::

:::simple
SQL is like an Excel sheet: every row must have the same columns. MongoDB is like a folder of forms: each form is a full record, and one form can have an extra field without changing the others.
:::

**📘 Explanation**

- **MongoDB:** flexible schema, nested data, easy horizontal scaling, great with JavaScript (JSON).
- **SQL:** fixed schema, strong relationships with joins, strict transactions; great for banking, orders, reports.

```js
// One MongoDB document
{
  "_id": "665f1c...",
  "name": "Vinay",
  "skills": ["React", "Node"],
  "address": { "city": "Hyderabad", "pin": "500001" }
}
```

:::say
- MongoDB stores flexible JSON-like documents; SQL stores rows in fixed tables.
- I choose MongoDB when data shape varies or is nested, and SQL when data is highly related and needs strict consistency.
- I used MongoDB in VTMS and PostgreSQL in my Classroom Monitoring project.
:::

### What are database, collection and document? {basic} {star}

:::quick
**Database** holds collections. **Collection** holds documents (like a table). **Document** is one record (like a row), stored as BSON.
:::

```js
SQL:      Database → Table      → Row      → Column
MongoDB:  Database → Collection → Document → Field
```

### Write basic CRUD queries {basic} {star}

:::quick
Create = `insertOne/insertMany`, Read = `find/findOne`, Update = `updateOne/updateMany`, Delete = `deleteOne/deleteMany`.
:::

**📘 Explanation**

- Common operators: `$eq $ne $gt $gte $lt $lte $in $nin $and $or $exists`.
- Update operators: `$set $unset $inc $push $pull $addToSet`.

```js
// Create
db.users.insertOne({ name: 'Vinay', age: 25, city: 'Hyderabad' });

// Read
db.users.find({ city: 'Hyderabad' });                 // all matches
db.users.findOne({ name: 'Vinay' });                  // first match
db.users.find({ age: { $gte: 18, $lt: 30 } });        // 18 <= age < 30
db.users.find({ skills: 'React' });                   // array contains 'React'
db.users.find({}, { name: 1, _id: 0 });               // only the name field
db.users.find().sort({ age: -1 }).limit(5);           // top 5 oldest

// Update
db.users.updateOne({ name: 'Vinay' }, { $set: { city: 'Vizag' } });
db.users.updateOne({ name: 'Vinay' }, { $push: { skills: 'Docker' } });
db.users.updateMany({}, { $inc: { loginCount: 1 } });

// Delete
db.users.deleteOne({ name: 'Vinay' });
```

### What is the _id field? {basic}

:::quick
Every document gets a unique `_id`. By default it's an **ObjectId**: a 12-byte value that includes the creation time, so it's unique and roughly sorted by time.
:::

## Mongoose

### What is Mongoose? What is a schema and a model? {basic} {star}

:::quick
Mongoose is a Node.js library for MongoDB. A **schema** defines the shape and rules of documents. A **model** is created from the schema and is used to query the collection.
:::

:::simple
Schema = the blank form design (which fields, which are required). Model = the office that stores and finds filled forms.
:::

```js
const mongoose = require('mongoose');

const userSchema = new mongoose.Schema({
  name:  { type: String, required: true, trim: true },
  email: { type: String, required: true, unique: true, lowercase: true },
  age:   { type: Number, min: 18 },
  role:  { type: String, enum: ['user', 'admin'], default: 'user' },
}, { timestamps: true });            // adds createdAt and updatedAt

const User = mongoose.model('User', userSchema);

// Using the model
await User.create({ name: 'Vinay', email: 'v@x.com', age: 25 });
const users = await User.find({ role: 'user' }).sort({ createdAt: -1 });
```

:::say
- Mongoose adds schemas, validation, middleware and easy query methods on top of MongoDB.
- A schema defines fields and rules; a model is the interface to the collection.
:::

### How do you create relationships in MongoDB? Embed vs reference {mid} {star}

:::quick
**Embed:** put related data inside the document (good when it's small and always read together, like an address). **Reference:** store the other document's `_id` (good when data is large, shared or grows without limit, like a user's orders).
:::

:::simple
Embedding is writing your address on your ID card. Referencing is writing a file number on your ID card that points to a separate file.
:::

```js
// Embed: address lives inside the user
{ name: 'Vinay', address: { city: 'Hyderabad', pin: '500001' } }

// Reference: order stores the user's id
const orderSchema = new mongoose.Schema({
  user:  { type: mongoose.Schema.Types.ObjectId, ref: 'User', required: true },
  items: [{ name: String, price: Number }],
  total: Number,
});
```

:::say
- I embed small data that is always read together, and reference data that is large, shared or keeps growing.
- A document has a 16 MB limit, so unlimited lists like comments or orders should be referenced.
:::

### What is populate() in Mongoose? {basic} {star}

:::quick
`populate()` replaces a referenced `_id` with the actual document from the other collection, like a simple join.
:::

```js
const orders = await Order.find().populate('user', 'name email');
// order.user is now { _id, name, email } instead of just an id
```

### What are Mongoose middleware (hooks)? {mid}

:::quick
Functions that run automatically **before or after** actions like `save`. The most common use is hashing a password before saving a user.
:::

```js
userSchema.pre('save', async function (next) {
  if (!this.isModified('password')) return next();
  this.password = await bcrypt.hash(this.password, 10);
  next();
});
```

## Aggregation, indexes and performance

### What is the aggregation pipeline? {mid} {star}

:::quick
A way to process data in **stages**, like an assembly line: `$match` (filter) → `$group` (group and calculate) → `$sort` → `$project` (choose fields) → `$lookup` (join) → `$limit`.
:::

:::simple
A juice factory line: wash the fruits (match), sort by type (group), squeeze (calculate), pack (project).
:::

```js
// Total sales per city, highest first
db.orders.aggregate([
  { $match: { status: 'delivered' } },
  { $group: { _id: '$city', totalSales: { $sum: '$amount' }, orders: { $sum: 1 } } },
  { $sort: { totalSales: -1 } },
  { $limit: 5 }
]);

// Join orders with users
db.orders.aggregate([
  { $lookup: { from: 'users', localField: 'user', foreignField: '_id', as: 'customer' } },
  { $unwind: '$customer' },
  { $project: { amount: 1, 'customer.name': 1 } }
]);
```

:::say
- The aggregation pipeline processes documents through stages like match, group, sort and lookup.
- I put `$match` first so later stages process fewer documents and can use indexes.
- At Snowa I optimised dashboard reports with aggregation pipelines and compound indexes.
:::

### What is an index? Why use it? {mid} {star}

:::quick
An index is a sorted list of a field's values that lets MongoDB find documents **without scanning the whole collection**. It makes reads much faster but adds a small cost to writes and uses storage.
:::

:::simple
Finding a topic using a book's index page instead of reading every page.
:::

**📘 Explanation**

- Index fields you **filter, sort or join** on often.
- **Compound index** order matters (the "ESR" rule: Equality, Sort, Range).
- Too many indexes slow down inserts and updates.

```js
db.users.createIndex({ email: 1 }, { unique: true });   // single field, unique
db.orders.createIndex({ user: 1, createdAt: -1 });      // compound index

// Check whether a query uses an index
db.orders.find({ user: id }).sort({ createdAt: -1 }).explain('executionStats');
// Look for IXSCAN (index used) instead of COLLSCAN (full scan)
```

### How do you do pagination in MongoDB? {mid} {star}

:::quick
Simple: `skip()` + `limit()`. For large collections, use **cursor-based pagination** (`_id` greater/less than the last seen id), because `skip` gets slower as pages go deeper.
:::

```js
// Page-based (simple)
const page = 2, limit = 10;
const users = await User.find().sort({ _id: -1 }).skip((page - 1) * limit).limit(limit);

// Cursor-based (fast for big data)
const next = await User.find({ _id: { $lt: lastId } }).sort({ _id: -1 }).limit(10);
```

### Does MongoDB support transactions? {mid}

:::quick
Yes, multi-document **ACID transactions** are supported on replica sets. Use them when several documents must change together (e.g. reduce stock and create an order).
:::

```js
const session = await mongoose.startSession();
try {
  session.startTransaction();
  await Product.updateOne({ _id: pid, stock: { $gte: 1 } }, { $inc: { stock: -1 } }, { session });
  await Order.create([{ user: uid, product: pid }], { session });
  await session.commitTransaction();
} catch (err) {
  await session.abortTransaction();
  throw err;
} finally {
  session.endSession();
}
```

### What are replication and sharding? {adv}

:::quick
**Replication** (replica set): copies of the same data on several servers for **high availability** (if one goes down, another takes over). **Sharding:** splitting data across servers for **scaling** very large collections.
:::

:::simple
Replication = keeping photocopies of an important file in 3 offices. Sharding = splitting a huge library so books A–M are in one building and N–Z in another.
:::

## Quick revision sheet

| Topic | Remember this |
|---|---|
| MongoDB | NoSQL document DB; flexible JSON-like (BSON) documents. |
| Structure | Database → collection → document → field. |
| CRUD | insertOne · find/findOne · updateOne ($set, $push, $inc) · deleteOne. |
| Mongoose | Schema (rules) + model (queries) + validation + hooks. |
| Embed vs reference | Embed small, read-together data; reference big/shared/growing data. |
| populate() | Replace an ObjectId with the real document (simple join). |
| Aggregation | $match → $group → $sort → $project → $lookup. |
| Index | Fast reads; check with explain() → IXSCAN vs COLLSCAN. |
| Pagination | skip+limit (simple) or _id cursor (fast at scale). |
| Scale | Replica set = copies (availability); sharding = split (scale). |
