# 🎯 Start here: your interview plan

A senior developer's game plan for Vinay: **Full Stack Developer (MERN), 3+ years**, applying now and preparing every day in parallel.

## How you'll be interviewed

Most MERN roles at 3+ years run **3–4 rounds**:

```mermaid
flowchart LR
  A[📝 Online test<br/>JS output + easy DSA] --> B[💻 Technical 1<br/>JS · React · Node basics<br/>+ 1-2 coding problems]
  B --> C[🛠️ Technical 2<br/>Machine coding +<br/>deep dive on YOUR projects]
  C --> D[🤝 Manager / HR<br/>story · switch reason<br/>salary · notice]
```

:::note
At 3+ years they care less about definitions and more about **"how did you use it, and why did you choose it?"** Your two products, **VTMS** and **Digital Classroom Monitoring**, are your biggest advantage. Most candidates only have to-do apps.
:::

## The answer formula (use it for every question)

Every good technical answer has **4 short parts**. Aim for **30–60 seconds**.

```mermaid
flowchart LR
  W[1 · WHAT<br/>one-line definition] --> H[2 · HOW<br/>how it works, simply] --> E[3 · EXAMPLE<br/>tiny code or analogy] --> P[4 · PROJECT<br/>where I used it]
```

**Example: "What is debouncing?"**
1. **What:** "Debouncing delays a function until the user stops triggering it for a set time."
2. **How:** "Each new event cancels the previous timer and starts a new one."
3. **Example:** "Typing in a search box fires the API call only 300 ms after the last keystroke."
4. **Project:** "I'd use it on a teacher search box, like in VTMS, so we don't hit the API on every keystroke."

Part 4 is what makes you sound like a 3-year developer instead of a fresher.
